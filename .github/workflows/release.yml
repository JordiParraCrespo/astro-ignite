# Release workflow modeled on shadcn-ui/ui.
#
# Two parallel flows share this file:
#
#   1. Stable — on push to main. The changesets action opens (or updates)
#      a "Version Packages" PR whenever pending changesets exist. Merging
#      that PR re-runs this workflow and publishes to npm as @latest.
#
#   2. Beta — on a PR being labeled with `🚀 autorelease`. The job rewrites
#      every publishable package's version to `0.0.0-beta.<short-sha>`,
#      builds, and publishes them with the `beta` dist-tag. Bumps are NOT
#      committed — they only live in the published tarballs.
#
# Publishable packages (kept in sync at the same version):
#   - astro-ignite           (primary CLI: bootstrap + future subcommands)
#   - create-astro-ignite    (shim that runs `astro-ignite bootstrap`)
#
# Required setup:
#   - Environment "Prod" secret: NPM_TOKEN (npm token with Bypass 2FA).
#   - Repository label: `🚀 autorelease`.
#   - Settings → Actions → General → Workflow permissions:
#       ✓ Allow GitHub Actions to create and approve pull requests.

name: Release

run-name: "${{ github.event_name == 'pull_request' && format('Release Beta — PR {0}', github.event.number) || 'Release Stable' }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prerelease:
    name: Publish beta to npm
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.repository_owner == 'JordiParraCrespo'
          && contains(github.event.pull_request.labels.*.name, '🚀 autorelease') }}
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Rewrite versions to beta
        run: node .github/version-script-beta.js

      - name: Build packages
        run: |
          pnpm --filter astro-ignite build
          pnpm --filter create-astro-ignite build

      - name: Publish astro-ignite (beta)
        run: cd packages/astro-ignite && npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-astro-ignite shim (beta)
        run: cd packages/create-astro-ignite && npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Read published version
        id: pkg
        run: echo "version=$(node -p "require('./packages/astro-ignite/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-ignite-${{ steps.pkg.outputs.version }}-pr-${{ github.event.number }}
          path: packages/astro-ignite/dist/index.js

  release:
    name: Create version PR or publish stable
    if: >-
      ${{ github.event_name == 'push'
          && github.repository_owner == 'JordiParraCrespo' }}
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter astro-ignite build
          pnpm --filter create-astro-ignite build

      - name: Open version PR or publish
        uses: changesets/action@v1
        with:
          setupGitUser: true
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          version: node .github/changeset-version.js
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
