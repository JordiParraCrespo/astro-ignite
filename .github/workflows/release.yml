# Manual release workflow.
#
# Triggered from Actions -> Release -> Run workflow. The workflow:
#   1. Applies any pending changesets (bumps versions, writes CHANGELOG,
#      and refreshes pnpm-lock.yaml via .github/changeset-version.js).
#   2. Builds both publishable packages.
#   3. Publishes to npm via `changeset publish`.
#   4. Only after a successful publish, commits the version bumps and pushes
#      them (plus the git tags) back to the branch it ran on.
#
# The bump is committed locally *before* publish (so `changeset publish`
# tags the version-bump commit) but pushed *after* — if the publish fails,
# nothing is pushed, so a re-run starts from a clean slate instead of an
# orphaned "versions bumped but nothing on npm" state.
#
# Prerelease mode is respected automatically — when `.changeset/pre.json`
# exists, publishes go to the configured dist-tag (e.g. `beta`) instead
# of `latest`.
#
# The `dry_run` input runs steps 1 and 2 but skips the publish, the commit,
# and the push, so you can sanity-check what would happen.
#
# Publishable packages (kept in sync at the same version):
#   - astro-ignite           (primary CLI: bootstrap + future subcommands)
#   - create-astro-ignite    (shim that runs `astro-ignite bootstrap`)
#
# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
# `changeset publish` detects this pnpm repo and shells out to `pnpm
# publish`, which exchanges the GitHub OIDC token (id-token: write) for a
# short-lived npm credential and attaches build provenance automatically.
#
# IMPORTANT: pnpm gained OIDC trusted-publishing support in 11.0.7, and
# 11.1.3 fixed its interaction with the `_authToken=${NODE_AUTH_TOKEN}`
# line `actions/setup-node` writes. The repo's pinned pnpm (packageManager
# field) predates this, so this job pins a newer pnpm just for the release
# via the action-setup `version:` input (it takes precedence over the
# packageManager field). Keep this >= 11.1.3.
#
# Required setup:
#   - On npmjs.com, add a Trusted Publisher to EACH package
#     (astro-ignite and create-astro-ignite):
#       Settings -> Trusted Publisher -> GitHub Actions
#         Organization/user:  JordiParraCrespo
#         Repository:         astro-ignite
#         Workflow filename:  release.yml
#         Environment name:   Prod   (must match the `environment:` below)
#   - Settings -> Actions -> General -> Workflow permissions:
#       Read and write permissions (so the version-bump commit can push).

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (version + build only, no publish, no commit)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: ${{ github.repository_owner == 'JordiParraCrespo' }}
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Pin a pnpm with OIDC trusted-publishing support (>= 11.1.3); this
      # overrides the older pnpm in the repo's packageManager field for this
      # job only. See the header note above.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bumps versions, writes CHANGELOG, and refreshes the lockfile so the
      # committed bumps don't ship with a stale pnpm-lock.yaml.
      - name: Apply pending changesets
        run: node .github/changeset-version.js

      # Commit locally so `changeset publish` tags this commit, but do not
      # push yet — the push happens only after a successful publish.
      - name: Commit version bumps
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(release): version packages"
          else
            echo "No version changes to commit."
          fi

      # `changeset publish` does not build — it only runs each package's
      # prepack hook. Both publishable packages must be built first so their
      # dist/ output exists in the tarball.
      - name: Build packages
        run: |
          pnpm --filter astro-ignite build
          pnpm --filter create-astro-ignite build

      # Authenticates via OIDC (id-token: write) — no NODE_AUTH_TOKEN.
      # Provenance is attached automatically.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm changeset publish

      # Publish succeeded — now persist the bump commit and the tags that
      # `changeset publish` created.
      - name: Push commit and tags
        if: ${{ !inputs.dry_run }}
        run: |
          git push
          git push --tags
