# Changesets release workflow.
#
# This workflow opens a "Version Packages" PR whenever there are pending
# changesets, then publishes to npm once that PR is merged. GitHub Actions
# needs explicit permission to open PRs, controlled at the repo level:
#
#   Settings → Actions → General → Workflow permissions
#     ✓ Allow GitHub Actions to create and approve pull requests
#
# Without that toggle the workflow fails with
# "GitHub Actions is not permitted to create or approve pull requests."
# (the workflow itself already grants the action `pull-requests: write`).

name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter create-astro-ignite build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
