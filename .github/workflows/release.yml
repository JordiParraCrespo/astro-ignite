# Manual release workflow.
#
# Triggered from Actions → Release → Run workflow. The workflow:
#   1. Applies any pending changesets (bumps versions, writes CHANGELOG).
#   2. Commits the version bumps back to the branch it ran on.
#   3. Builds the CLI.
#   4. Publishes to npm via `changeset publish`.
#
# Prerelease mode is respected automatically — when `.changeset/pre.json`
# exists, publishes go to the configured dist-tag (e.g. `beta`) instead
# of `latest`.
#
# The `dry_run` input runs steps 1 and 3 but skips the commit and the
# npm publish, so you can sanity-check what would happen.

name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no commit, no publish)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Apply pending changesets
        run: pnpm changeset version

      - name: Commit version bumps
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(release): version packages"
            git push
          else
            echo "No version changes to commit."
          fi

      - name: Build
        run: pnpm --filter create-astro-ignite build

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: ${{ !inputs.dry_run }}
        run: git push --tags
