name: Hermes PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Hermes PR Reviewer
        run: |
          npm init -y
          npm install @octokit/rest openai dotenv

      - name: Run Hermes Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HERMES_MODEL: ${{ secrets.HERMES_MODEL || 'openrouter/moonshotai/kimi-chat' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node .github/workflows/hermes-review.js
