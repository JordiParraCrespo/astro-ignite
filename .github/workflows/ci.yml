name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter create-astro-ignite typecheck
      - run: pnpm --filter @astro-ignite/template-starter typecheck
      - run: pnpm --filter @astro-ignite/template-docs typecheck
      - run: pnpm --filter @astro-ignite/site typecheck
      - run: pnpm --filter @astro-ignite/docs typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  template-build:
    name: Template build (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [starter, docs]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Retry up to 3 times; astro:fonts fetches from fonts.bunny.net at build
      # time and that occasionally flakes in CI.
      - name: Build template (with retry)
        run: |
          set +e
          for i in 1 2 3; do
            pnpm --filter @astro-ignite/template-${{ matrix.template }} build
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::template build failed (attempt $i), retrying after 5s"
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: template-${{ matrix.template }}-dist
          path: packages/templates/${{ matrix.template }}/dist
          retention-days: 7

  e2e-scaffold:
    name: E2E scaffold (${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [pnpm, npm, yarn, bun]
    env:
      # Stop corepack rejecting yarn / bun / npm because the monorepo root
      # pins pnpm via the `packageManager` field — the scaffolded playground
      # is being installed by a different package manager on purpose.
      COREPACK_ENABLE_STRICT: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.pm == 'yarn'
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter astro-ignite build
      - run: node ./scripts/scaffold-test.mjs --full --pm=${{ matrix.pm }}
      - if: failure() && matrix.pm == 'pnpm'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-playground
          path: tests/e2e/playwright-report
          retention-days: 7

  e2e:
    name: E2E (templates + apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.0-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-1.49.0-${{ runner.os }}-
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run e2e (starter, docs-template, site, docs-app, docs-template-built)
        run: pnpm test:e2e --project=starter --project=docs-template --project=docs-template-built --project=site --project=docs-app
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  apps-build:
    name: App build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [site, docs]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build app (with retry)
        run: |
          set +e
          for i in 1 2 3; do
            pnpm --filter @astro-ignite/${{ matrix.app }} build
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            echo "::warning::app build failed (attempt $i), retrying after 5s"
            sleep 5
          done
          exit 1
