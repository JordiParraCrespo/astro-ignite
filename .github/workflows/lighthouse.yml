name: Lighthouse

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI (mobile)
    runs-on: gha-vm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        continue-on-error: true
      - if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm --filter astro-ignite build

      # Refresh the bundled template cache so the scaffold reflects this
      # branch's templates — resolveTemplateRoot prefers the committed cache,
      # which can lag packages/templates/.
      - name: Refresh template cache
        run: node packages/astro-ignite/scripts/copy-templates.mjs

      # Call the local CLI directly — the `create-astro-ignite` shim runs
      # `npx astro-ignite@latest`, which would scaffold from the published
      # version instead of this branch's templates.
      - name: Scaffold playground
        run: |
          rm -rf apps/playground
          mkdir -p apps/playground
          node packages/astro-ignite/dist/index.js bootstrap apps/playground --yes --no-git

      - name: Build playground
        run: pnpm --filter playground build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          cd apps/playground
          lhci autorun --config=../../.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
